name: merkatu-stack

services:
  # ============================================
  # POSTGRES - Banco de dados local
  # ============================================
  postgres_local:
    image: postgres:15-alpine
    container_name: aless-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - merkatu_network

  # ============================================
  # REDIS - Cache persistente
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aless-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - merkatu_network

  # ============================================
  # BACKEND - API Node.js (MERKATU)
  # ============================================
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - merkatu_network
    image: alessandroxtt/merkatu-backend:1.0.0
    container_name: aless-back
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-12345}@postgres_local:5432/${POSTGRES_DB:-postgres}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}/0
      DEBUG: ${DEBUG:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres_local:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "start"]
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data
    restart: unless-stopped

  # ============================================
  # FRONTEND - Aplicacao Vite
  # ============================================
  frontend:
    image: alessandroxtt/merkatu-frontend:1.0.0
    container_name: aless-front
    ports:
      - "${FRONTEND_PORT:-5173}:3000"
    command: ["npm", "run", "serve", "--", "--host", "0.0.0.0", "--port", "3000"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - merkatu_network
    restart: unless-stopped

  # ============================================
  # MONITORAMENTO - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: aless-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - merkatu_network
    restart: unless-stopped

volumes:
  postgres_local_data:
  redis_data:

networks:
  merkatu_network:
    driver: bridge
